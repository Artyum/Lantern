<!DOCTYPE html>
<html lang="en" data-theme="morning-mist" data-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern</title>
  <script>
    (function () {
      var dark = {"deep-ocean":1,"amber-night":1,"northern-spruce":1,"charcoal-dusk":1,"midnight-berry":1,"rose-night":1};
      var aliases = {dark:"deep-ocean",light:"morning-mist",lantern:"amber-night",parchment:"sandy-dawn",polar:"morning-mist",sakura:"rose-dawn",amethyst:"midnight-berry",graphite:"charcoal-dusk",moss:"green-meadow",copper:"sandy-dawn",ocean:"deep-ocean",wine:"rose-night",latarnia:"amber-night",pergamin:"sandy-dawn",ametyst:"midnight-berry",grafit:"charcoal-dusk",mech:"green-meadow",miedz:"sandy-dawn",wino:"rose-night"};
      var allowed = {"morning-mist":1,"sandy-dawn":1,"green-meadow":1,"graphite-day":1,"berry-dawn":1,"rose-dawn":1,"deep-ocean":1,"amber-night":1,"northern-spruce":1,"charcoal-dusk":1,"midnight-berry":1,"rose-night":1};
      var id;
      try { id = localStorage.getItem("lantern-theme"); } catch (e) {}
      id = aliases[id] || id;
      if (!allowed[id]) id = matchMedia("(prefers-color-scheme: dark)").matches ? "deep-ocean" : "morning-mist";
      document.documentElement.setAttribute("data-theme", id);
      document.documentElement.setAttribute("data-scheme", dark[id] ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/app.css?v=__ASSET_CSS__">
  <link rel="icon" href="/icons/__logo" type="image/svg+xml">
</head>
<body>
  <div class="shell">
  <header class="top">
    <div class="brand">
      <img class="mark" src="/icons/__logo" alt="" width="42" height="42">
      <div class="brand-copy">
        <h1 id="title">Lantern</h1>
      </div>
    </div>
    <div class="tools">
      <label class="search">
        <span class="sr-only">Search services</span>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16.2 16.2 21 21"/></svg>
        <input id="q" type="search" placeholder="Search services…" autocomplete="off">
      </label>
      <button type="button" id="add-section" class="tool-icon" title="Add section">
        <span class="sr-only">Add section</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="width-picker" id="width-picker">
        <button type="button" id="width-toggle" class="tool-icon" aria-haspopup="dialog" aria-expanded="false" aria-controls="width-panel" title="Cards per row">
          <span class="sr-only">Cards per row</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/></svg>
        </button>
        <div id="width-panel" class="width-panel" role="dialog" aria-label="Cards per row" hidden>
          <div class="width-panel-head">
            <span class="width-panel-title">Cards per row</span>
          </div>
          <div id="grid-cols-picker" class="grid-cols-picker" role="group" aria-label="Cards per row"></div>
        </div>
      </div>
      <div class="theme-picker" id="theme-picker">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu" title="Color theme">
          <span class="theme-swatch" id="theme-swatch" aria-hidden="true"></span>
          <span id="theme-label">Morning Mist</span>
          <svg class="theme-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 10l6 6 6-6"/></svg>
        </button>
        <ul id="theme-menu" class="theme-menu" role="listbox" aria-label="Color theme" hidden></ul>
      </div>
    </div>
  </header>
  <div class="workspace">
    <aside class="section-nav" id="section-nav" hidden>
      <div class="section-nav-head">
        <h2 class="section-nav-title">Sections</h2>
        <div class="section-nav-bulk">
          <button type="button" id="section-expand-all" class="section-nav-mini" title="Expand all sections" aria-label="Expand all sections">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
          </button>
          <button type="button" id="section-collapse-all" class="section-nav-mini" title="Collapse all sections" aria-label="Collapse all sections">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 11l-5-5-5 5M17 18l-5-5-5 5"/></svg>
          </button>
        </div>
        <button type="button" id="section-nav-toggle" class="section-nav-toggle" aria-controls="section-nav-list" aria-expanded="true" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <nav aria-label="Sections">
        <ul id="section-nav-list" class="section-nav-list"></ul>
      </nav>
    </aside>
    <div class="workspace-main">
      <main id="board"></main>
      <p id="empty" class="empty" hidden>No matching services.</p>
    </div>
  </div>
  </div>
  <!-- initial-config -->
  <button type="button" id="section-nav-edge" class="section-nav-edge" hidden aria-controls="section-nav" aria-expanded="false" title="Open sections">
    <span class="sr-only">Open sections</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
  </button>
  <div id="section-nav-backdrop" class="section-nav-backdrop" hidden></div>
  <dialog id="item-editor" class="item-editor">
    <form id="item-form">
      <header class="modal-head">
        <h2 id="item-title">Edit tile</h2>
      </header>
      <div class="modal-body">
        <div class="icon-card">
          <div class="icon-preview">
            <img id="item-icon-preview" alt="" width="144" height="144">
          </div>
          <div class="icon-tools">
            <button type="button" id="item-icon-refresh" class="ghost icon-tool" title="Reload icon" aria-label="Reload icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            </button>
            <button type="button" id="item-icon-upload" class="ghost icon-tool" title="Upload icon" aria-label="Upload icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V7"/><path d="M8.5 10.5 12 7l3.5 3.5"/><path d="M5 18h14"/></svg>
            </button>
            <input id="item-icon-file" class="sr-only" name="iconFile" type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp,image/gif,image/x-icon,.ico">
          </div>
        </div>
        <label>
          Name
          <input id="item-name" name="name" type="text" required maxlength="80" autocomplete="off">
        </label>
        <label>
          URL
          <input id="item-url" name="url" type="url" required maxlength="500" autocomplete="off">
        </label>
        <p id="item-error" class="form-error" role="alert" hidden></p>
      </div>
      <footer class="modal-foot">
        <button type="button" id="item-delete" class="danger" hidden>Delete</button>
        <button type="button" id="item-cancel" class="ghost">Cancel</button>
        <button type="submit" id="item-save" class="primary">Save</button>
      </footer>
    </form>
  </dialog>
  <dialog id="section-editor" class="item-editor">
    <form id="section-form">
      <header class="modal-head">
        <h2>New section</h2>
      </header>
      <div class="modal-body">
        <label>
          Name
          <input id="section-name" name="name" type="text" required maxlength="80" autocomplete="off" placeholder="e.g. Tools">
        </label>
        <p id="section-error" class="form-error" role="alert" hidden></p>
      </div>
      <footer class="modal-foot">
        <button type="button" id="section-cancel" class="ghost">Cancel</button>
        <button type="submit" id="section-save" class="primary">Add</button>
      </footer>
    </form>
  </dialog>
  <dialog id="section-confirm" class="item-editor">
    <form id="section-confirm-form">
      <header class="modal-head">
        <h2>Delete section?</h2>
      </header>
      <div class="modal-body">
        <p id="section-confirm-text" class="confirm-copy"></p>
        <p id="section-confirm-error" class="form-error" role="alert" hidden></p>
      </div>
      <footer class="modal-foot">
        <button type="button" id="section-confirm-cancel" class="ghost">Cancel</button>
        <button type="submit" id="section-confirm-ok" class="danger">Delete</button>
      </footer>
    </form>
  </dialog>
  <dialog id="item-confirm" class="item-editor">
    <form id="item-confirm-form">
      <header class="modal-head">
        <h2>Delete tile?</h2>
      </header>
      <div class="modal-body">
        <p id="item-confirm-text" class="confirm-copy"></p>
        <p id="item-confirm-error" class="form-error" role="alert" hidden></p>
      </div>
      <footer class="modal-foot">
        <button type="button" id="item-confirm-cancel" class="ghost">Cancel</button>
        <button type="submit" id="item-confirm-ok" class="danger">Delete</button>
      </footer>
    </form>
  </dialog>
  <script src="/app.js?v=__ASSET_JS__"></script>
</body>
</html>
