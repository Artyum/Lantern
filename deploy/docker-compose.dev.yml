networks:
  traefik-net:
    external: true
    name: traefik-net

services:
  lantern_dev:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    image: lantern:dev
    container_name: lantern_dev
    restart: "no"
    init: true
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      CONFIG_PATH: /config/config.json
      CACHE_DIR: /data/cache
      LISTEN: ":8080"
    env_file:
      - .env.dev
    volumes:
      - ..:/src
      - ../config.json:/config/config.json
      - ../mount/go-mod:/go/pkg/mod
      - ../mount/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lantern_dev.rule=Host(`lantern.lan`)"
      - "traefik.http.routers.lantern_dev.middlewares=lan-only@file"
      - "traefik.http.services.lantern_dev.loadbalancer.server.port=8080"